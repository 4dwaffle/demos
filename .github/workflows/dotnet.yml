name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore AmbientUnitOfWork/AmbientUnitOfWork.slnx
      - name: Build
        run: dotnet build AmbientUnitOfWork/AmbientUnitOfWork.slnx --configuration Release --no-restore
      - name: Integration tests
        run: dotnet test AmbientUnitOfWork/AmbientUnitOfWork.slnx --configuration Release --no-build
